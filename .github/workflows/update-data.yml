name: Update game data
on:
  schedule:
    - cron: "17 6 * * 1" # weekly (Mondays) — upstream tracks Reforged balance patches
  workflow_dispatch:

# SUPPLY-CHAIN ISOLATION (two jobs on purpose): the import step executes an
# UNPINNED remote bundle from the upstream's GitHub Pages (see import.ts).
# That code must never run in a job that can mint the app token — a compromised
# upstream could exfiltrate the job's secrets. So: `import` runs with zero
# secrets and a read-only token, and hands the data diff to `open-pr` as an
# artifact; only `open-pr` (which runs no remote code) touches the PAT.
permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      provenance: ${{ steps.diff.outputs.provenance }}
      fallback: ${{ steps.import.outputs.fallback }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # No version here: pnpm/action-setup reads the packageManager field
      # from package.json (specifying both makes the action fail).
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Import latest upstream data
        id: import
        # `pnpm import` is a pnpm builtin (lockfile import); our script must be
        # invoked with `run`. URL after `--` so it reaches the script, not pnpm.
        # Try tip-fresh Pages; on any failure fall back to the pinned npm
        # package so the weekly job never breaks on a fragile external surface.
        #
        # The fallback is recorded as an OUTPUT, not just a `::warning::`, and the
        # `notify-degraded` job below turns it into an issue. A warning annotation is
        # visible only to someone already reading the run — and this job exists
        # precisely so nobody has to. Twice now the fallback has hidden a real,
        # persistent break of the Pages path rather than a fragile-network blip: the
        # `--` argument bug (masked "for months", see import.ts) and the 2.x constant
        # tables (run #18). Both times the run was green and the pinned npm package
        # produced a zero diff, so no PR appeared and the quiet looked like a quiet
        # week upstream.
        run: |
          if pnpm --filter @gw1-mcp/gw-data run import:data -- https://build-wars.github.io/gw-skilldata; then
            echo "fallback=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Pages import failed; importing from the pinned npm package"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            pnpm --filter @gw1-mcp/gw-data run import:data
          fi
      - name: Regenerate heroes.json from the GWCA HeroID enum + curated overlay
        run: pnpm --filter @gw1-mcp/gw-data import:heroes
      - name: Check for meaningful changes (ignore import date)
        id: diff
        # Two kinds of "meaningful", because reverting _meta.json unconditionally
        # cost something real. Run #19 (2026-08-17, a manual re-run) took the
        # Pages path for the first time after the 2.x constant-table fix, computed
        # `pages@e32dbdc4e0ec` with all five sha256 hashes, and discarded it —
        # upstream had touched no skill, so _meta.json was the only diff. The
        # committed record went on saying `npm:2.0.0`, and nothing in the
        # repository showed the importer had recovered.
        #
        # So a change of CHANNEL (npm <-> pages) now counts on its own, while a
        # date, version or hash bump within the same channel still does not —
        # otherwise this opens a PR every Monday. The decision is a unit-tested
        # pure function rather than shell string-slicing, because it is exactly
        # the kind of logic that is never exercised until it is wrong.
        #
        # ABSOLUTE paths, and `pnpm exec` from the repo root rather than
        # `pnpm --filter <pkg> exec`. Both halves are the run #20 fix: --filter
        # chdirs into packages/gw-data, so the repo-root-relative argument this
        # step used to pass resolved to packages/gw-data/packages/gw-data/... and
        # the job died with ENOENT. The script has no dependencies of its own, so
        # there is nothing --filter was buying. provenance-cli.test.ts runs the
        # script from a foreign cwd and asserts this step keeps passing absolute
        # paths — the unit tests cannot see either mistake.
        run: |
          git show HEAD:packages/gw-data/data/_meta.json > "$RUNNER_TEMP/meta-before.json" 2>/dev/null || true
          provenance=$(node \
            "$GITHUB_WORKSPACE/packages/gw-data/scripts/provenance-changed.ts" \
            "$RUNNER_TEMP/meta-before.json" \
            "$GITHUB_WORKSPACE/packages/gw-data/data/_meta.json")
          echo "provenance=$provenance" >> "$GITHUB_OUTPUT"
          if git diff --numstat -- packages/gw-data/data gwtoolbox-plugin/AccountExport/hero-names.generated.h | grep -v "_meta.json" | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$provenance" = "changed" ]; then
            echo "::notice::Data unchanged, but the import channel changed — committing provenance alone."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            git checkout -- packages/gw-data/data/_meta.json || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm -r test
        if: steps.diff.outputs.changed == 'true'
      - name: Upload the data diff as an artifact
        if: steps.diff.outputs.changed == 'true'
        run: git diff -- packages/gw-data/data gwtoolbox-plugin/AccountExport/hero-names.generated.h > /tmp/data-update.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.diff.outputs.changed == 'true'
        with:
          name: data-update
          path: /tmp/data-update.patch
          retention-days: 3

  open-pr:
    needs: import
    if: needs.import.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mint an ephemeral app token (gw1-mcp-bot)
        # Same App as release-please; the token lives ~1h. The PR is authored
        # by gw1-mcp-bot, so CI/CodeQL trigger normally on it.
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # Client ID (a string, not the numeric App ID) is the non-deprecated
          # input as of create-github-app-token v3.1; stored as a repo var since
          # it is not secret (visible on the App's settings page). The old
          # (the legacy numeric AUTOMATION_APP_ID secret is no longer referenced).
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: data-update
          path: /tmp
      - name: Apply the imported data
        run: git apply /tmp/data-update.patch
      # Descriptions travel verbatim into an LLM's context via get_skill and
      # search_skills, so a vandalised upstream needs no code execution to attack
      # a consumer, and no invariant test can catch it: the suite checks ids and
      # types, never the meaning of free text.
      #
      # Flagging *any* description change was measured against upstream history
      # and rejected: 97% of descriptions embed the numbers a balance patch
      # edits, and legitimate commits reword text wholesale (6e05969 changed 301
      # description fields at once). A gate that fires weekly is rubber-stamping.
      # This flags added text instead — the shape an injected instruction has —
      # at a threshold no commit in upstream history would have tripped.
      # Pins the Node that runs the growth gate. NOT an install step: setup-node
      # fetches a Node distribution and nothing else, so this job still has no
      # `pnpm install` and still executes no third-party code — the property the
      # two-job split exists to protect. It is here because the gate is a `.ts`
      # file run by bare `node`, which needs the type stripping unflagged since
      # 22.18; without this the version would come from whatever the runner image
      # happens to ship, which is exactly the kind of unstated dependency this
      # repo pins everywhere else.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
      - name: Flag suspicious description growth (prompt-injection channel)
        id: desc
        # Bare node: this job has no pnpm install and must not gain one (it holds
        # contents:write). The script has zero dependencies for that reason, and
        # node strips its type annotations without ever type-checking them.
        run: node packages/gw-data/scripts/description-growth.ts >> "$GITHUB_OUTPUT"
      - name: Open pull request
        id: data-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/update-game-data
          title: "chore: update game data from upstream"
          commit-message: "chore: update game data from build-wars/gw-skilldata"
          body: |
            Automated re-import from build-wars/gw-skilldata (Reforged-tracking upstream) detected changes.
            Review the diff in `packages/gw-data/data/`.

            Import channel changed: ${{ needs.import.outputs.provenance }}.
            When `changed`, this PR may touch `_meta.json` ALONE — that is not a
            no-op: it records that the importer switched between the Pages path
            and the pinned npm fallback, which the repository could not otherwise
            show (see run #19, 2026-08-17). A `pages@…` provenance also restores
            the sha256 content hashes the npm path deliberately omits.

            CI runs the full golden-fixture suite against the new data.

            Suspicious description growth: ${{ steps.desc.outputs.changed }}.
            When true, auto-merge is withheld: a description gained more added
            text than any legitimate upstream commit ever has, and that text
            reaches an LLM's context verbatim. Read the description diff — the
            job log names the skills. Numeric balance edits and upstream
            rewording do not trip this.

      - name: Enable auto-merge (zero-touch when CI passes, numeric diffs only)
        if: ${{ steps.data-pr.outputs.pull-request-number && steps.desc.outputs.changed == 'false' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge ${{ steps.data-pr.outputs.pull-request-number }} --auto --squash

  # A zero-touch weekly job is exactly the kind that fails unwatched — and the
  # gates here are meant to WITHHOLD the merge, so a crash reads the same as a
  # quiet week from the outside. `open-pr` is skipped when upstream did not
  # change, which is not a failure and produces nothing.
  notify:
    needs: [import, open-pr]
    if: failure()
    # See the same block in upstream-pin-bump.yml: the callee cannot widen the
    # caller's token, so `issues: write` has to be granted at the call site.
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow: Update game data

  # The green-run failure mode. `notify` above cannot cover it: the fallback makes the
  # job SUCCEED, so `if: failure()` never fires and the only trace is a warning
  # annotation nobody reads. Its own issue thread, not the one above, because the two
  # conditions have different causes and different fixes — and because the recurrence
  # count is the datum (see notify-failure.yml): "degraded 6 weeks running" is the
  # sentence that distinguishes a fragile network from a broken importer.
  notify-degraded:
    needs: import
    if: ${{ !cancelled() && needs.import.outputs.fallback == 'true' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow: Update game data (Pages import degraded)
      detail: >-
        The weekly import could not read the upstream's GitHub Pages release files and
        fell back to the pinned npm package, so **this run imported whatever version the
        lockfile already pins** rather than upstream tip. The run is green and the data
        is unchanged, which is exactly why this needs saying out loud. If it recurs, the
        Pages path is broken rather than the network being fragile — check the `import`
        job log for the real error, not this issue.
