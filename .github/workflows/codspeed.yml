name: CodSpeed
on:
  push:
    branches: [main]
  pull_request:
  # Lets CodSpeed dispatch a backtest run to seed the baseline of a new branch.
  workflow_dispatch:
# Least privilege, same as CI: read the repo, plus the OIDC token CodSpeed
# exchanges for an upload credential (no secret to store or rotate).
permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # No version here: pnpm/action-setup reads the packageManager field
      # from package.json (specifying both makes the action fail).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run benchmarks
        # One invocation for the whole workspace: `pnpm -r bench` runs the
        # four packages' `vitest bench` in turn and the runner collects every
        # result into a single report.
        uses: CodSpeedHQ/action@f842b9a3ffe213dbb81768fd7f7eeb4dfcf1c369 # v5.4.2
        with:
          mode: simulation
          run: pnpm -r bench
