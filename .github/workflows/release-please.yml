name: Release Please
# Maintains the release PR from conventional commits; when the merge of that
# PR creates a release, sibling jobs in THIS run publish to the MCP Registry
# and attach the plugin DLL — via reusable workflows (uses:). They must be
# chained here by needs/if: events created by release-please (the release,
# the tag) never trigger separate on-release workflows.
on:
  push:
    branches: [main]
# Read-only by default. The release-please job acts through the gw1-mcp-bot app
# token, not GITHUB_TOKEN, so it needs nothing here; the two reusable jobs are
# granted exactly what they need at their call site (a job-level grant may
# exceed this default, and a callee can never exceed its caller's job).
permissions:
  contents: read
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Mint an ephemeral app token (gw1-mcp-bot)
        # GitHub App replaces the old long-lived PAT: the installation token
        # minted here lives ~1h and dies with the run; only the private key
        # persists (repo secret). App events trigger workflows normally (the
        # anti-recursion rule only mutes GITHUB_TOKEN), and the bot has no
        # ruleset bypass — automation goes through the same door as everyone.
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # Client ID (a string, not the numeric App ID) is the non-deprecated
          # input as of create-github-app-token v3.1; stored as a repo var since
          # it is not secret (visible on the App's settings page). The old
          # (the legacy numeric AUTOMATION_APP_ID secret is no longer referenced).
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # User-facing DLL: rebuilt and attached to every release so players
  # download it from the Releases page (Actions artifacts expire after 90
  # days and require a GitHub login). Chained here by needs/if rather than
  # left to an on-release trigger, so the release run is self-contained.
  # Reuses the plugin build workflow (single source for the vcpkg toolchain)
  # and asks it to upload the DLL straight onto the freshly created release.
  attach-plugin-to-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/build-gwtoolbox-plugin.yml
    permissions:
      contents: write
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}

  # Reuses the registry publish workflow (single source).
  publish-registry:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/publish-registry.yml
    permissions:
      id-token: write
      contents: read
