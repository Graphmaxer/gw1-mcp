name: Install mcp-publisher
description: Download the mcp-publisher version pinned in .github/pins.env and verify its SHA-256.

# One copy of the download, so the release run and the pin check run the SAME
# steps. A bumped pin used to be exercised for the first time by a release:
# a wrong digest or a renamed asset failed after the tag was already cut.
#
# Pinned to a specific version with a checked SHA-256 instead of piping
# `releases/latest` straight into tar in an OIDC job (GW1-05): a compromised
# `latest` would otherwise run in the id-token context. The version and the
# two digests live in .github/pins.env so the weekly tripwire can open the PR
# that bumps them (see that file's header); bump all three together. Digests
# come from the release assets (also Sigstore-signed upstream).
#
# The pins are read here rather than exported job-wide: nothing else in either
# caller needs them, and a name as generic as VERSION in a shared environment
# is an accident waiting for a second step.

runs:
  using: composite
  steps:
    - name: Install mcp-publisher (pinned + digest-verified)
      shell: bash
      run: |
        set -euo pipefail
        pin() { grep -E "^$1=" .github/pins.env | cut -d= -f2-; }
        version=$(pin MCP_PUBLISHER_VERSION)
        arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
        os=$(uname -s | tr '[:upper:]' '[:lower:]')
        expected=$(pin "MCP_PUBLISHER_SHA256_$(echo "$arch" | tr '[:lower:]' '[:upper:]')")
        : "${version:?MCP_PUBLISHER_VERSION is missing from .github/pins.env}"
        : "${expected:?no digest in .github/pins.env for ${arch}}"
        curl --fail --show-error --location \
          "https://github.com/modelcontextprotocol/registry/releases/download/${version}/mcp-publisher_${os}_${arch}.tar.gz" \
          -o mcp-publisher.tar.gz
        echo "${expected}  mcp-publisher.tar.gz" | sha256sum --check --strict
        tar xzf mcp-publisher.tar.gz mcp-publisher
        ./mcp-publisher --help > /dev/null
