packages:
  - "packages/*"
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
# NO `overrides:` BLOCK, on purpose (last four removed 2026-11-13). Transitive
# advisories are fixed in the LOCKFILE: `pnpm update --recursive --depth Infinity
# <pkg>`, or let Dependabot do it. An override is a floor someone has to keep
# raising by hand, and it appears to stop Dependabot's own transitive security
# updates. Add one back only when a parent's declared range CANNOT reach the fix
# (an exact pin on a vulnerable version, or a range admitting a vulnerable major),
# say which parent and why, and delete it once that parent catches up. The four
# removed ones (@hono/node-server, sharp, hono, undici) had all become redundant
# that way: with the block deleted the lockfile resolves to the same patched
# single copies and `pnpm audit` stays at zero.
