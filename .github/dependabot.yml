version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Mirrors pnpm's own minimumReleaseAge default since pnpm 11 (1 day, unconfigured by
    # us — see docs/handbook/releasing.md). Without this, Dependabot proposes a PR the moment
    # a version publishes, then CI fails with
    # ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION because pnpm won't resolve it
    # yet — a guaranteed-red PR for no reason. Cooldown also delays security
    # PRs by the same day (GitHub's documented default), which is correct
    # here: pnpm would refuse to resolve a <24h-old patched version anyway,
    # so proposing it sooner would just fail the same way.
    cooldown:
      default-days: 1
    commit-message:
      prefix: deps # matches the release-please changelog "Dependencies" section
    groups:
      # Listed FIRST (a dependency joins the first group that matches) and with
      # no update-types, so MAJORS are included. These three only move together:
      # @vitest/coverage-v8 peers on the exact vitest version and the CodSpeed
      # plugin peers on a vitest major range, so an ungrouped major bump of any
      # one of them is unresolvable on its own: vitest 5.0.0 shipped 2026-09-03
      # and no PR appeared for ten weeks, so that major was done by hand.
      vitest-toolchain:
        patterns: ["vitest", "@vitest/*", "@codspeed/vitest-plugin"]
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci # hidden from the changelog, like all ci: commits
    groups:
      actions:
        patterns: ["*"]
