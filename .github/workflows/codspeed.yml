name: CodSpeed
on:
  push:
    branches: [main]
  pull_request:
  # Lets CodSpeed dispatch a backtest run to seed the baseline of a new branch.
  workflow_dispatch:
# Least privilege, same as CI: read the repo, plus the OIDC token CodSpeed
# exchanges for an upload credential (no secret to store or rotate).
permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # No version here: pnpm/action-setup reads the packageManager field
      # from package.json (specifying both makes the action fail).
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run benchmarks
        # One invocation for the whole workspace: `pnpm -r bench` runs the
        # four packages' `vitest bench` in turn and the runner collects every
        # result into a single report.
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          run: pnpm -r bench
